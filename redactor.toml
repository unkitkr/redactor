# Secrets are read only from LLM_API_KEY and REDACTOR_SECRET_KEY.
# Local processing is the default. Set LLM_ENABLED=1 to allow hosted detection.
# Set LLM_ENABLED=0 to disable remote detection and judging together.
# Selected models from benchmarks/README.md; local weights must be staged first.
# GLiNER and PP-OCR run locally; hosted text detection is optional.
[remote]
enabled = false
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
provider = "openrouter"
reasoning_enabled = true
temperature = 0.0
vision = false
json_mode = true
budget_usd = "3.00"
# USD per million tokens; OpenRouter routing rejects providers above these caps.
# Public model catalog checked on 2026-11-06; reasoning counts as output tokens.
input_usd_per_million = "0.15"
output_usd_per_million = "0.50"
# Includes the initial call: 3 attempts means at most 2 retries.
max_attempts = 3
retry_initial_seconds = 0.5
retry_max_seconds = 8.0
timeout_seconds = 30.0
deadline_seconds = 65.0
circuit_failures = 3
circuit_cooldown_seconds = 60.0
max_output_tokens = 2048
max_input_bytes = 16384

[local]
ner = "gliner"
ocr = "ppocr"
spacy_model = "en_core_web_sm"
ner_max_characters = 16384
ner_cache_entries = 512
ner_cache_characters = 1024
model_directory = ".models"
ocr_language = "en"
ner_directory = ".models/gliner-pii-edge-v1.0"
ocr_directory = ".models/ppocr-v5"

[verification]
judge_enabled = true
# Judge selection is independent of the detection model. Blank disables remote judging.
# Detection scores do not validate a judge; no judge was benchmarked.
judge_model = ""
judge_vision = false
# Judge prices are separate because its model may have different rates.
# input_usd_per_million = "0.00"
# output_usd_per_million = "0.00"

[resources]
max_record_bytes = 1048576
chunk_bytes = 4194304
max_image_pixels = 16000000
max_nesting_depth = 16
checkpoint_records = 5000
# In-memory native parsers are bounded; CSV, text, and JSON use streaming readers.
max_native_file_bytes = 33554432
max_archive_bytes = 268435456

[policy]
maximum_date_shift_days = 365
