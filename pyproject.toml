[project]
name = "phi-takehome"
version = "0.1.0"
description = "A local, resumable PHI pseudonymization pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
redactor = "redactor.coordinator.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redactor"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8", "pytest-cov>=6", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
extend-exclude = ["tools/make_large_csv.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-interpreter-path = ".venv/bin/python"

[tool.coverage.run]
source = ["redactor"]

[tool.coverage.report]
show_missing = true
