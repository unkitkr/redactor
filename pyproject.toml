[project]
name = "phi-takehome"
version = "0.1.0"
description = "A local, resumable PHI pseudonymization pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46,<51",
    "defusedxml>=0.7,<1",
    "en-core-web-sm",
    "httpx>=0.28,<1",
    "ijson>=3.4,<4",
    "numpy>=2,<3",
    "onnxruntime==1.31.1",
    "openai>=2,<3",
    "pillow>=12,<14",
    "pydantic>=2.10,<3",
    "pydicom>=3,<4",
    "pymupdf>=1.26,<2",
    "rapidocr==3.10.0",
    "spacy>=3.8.18,<3.9",
    "tokenizers==0.23.3",
]

[project.scripts]
redactor = "redactor.coordinator.cli:main"
redactor-dashboard = "redactor.monitoring.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redactor"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
extend-exclude = ["tools/make_large_csv.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# PyMuPDF exposes several native entry points without Python annotations.
untyped_calls_exclude = ["pymupdf"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-interpreter-path = ".venv/bin/python"

[tool.coverage.run]
source = ["redactor"]

[tool.coverage.report]
show_missing = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*", "rapidocr.*"]
ignore_missing_imports = true
